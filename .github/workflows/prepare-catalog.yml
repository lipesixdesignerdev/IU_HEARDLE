name: Prepare reviewed IU catalogue
on:
  push:
    branches: [fix/iu-catalog-artwork]
    paths:
      - .github/workflows/prepare-catalog.yml
      - scripts/import-assets.py
      - catalog/catalog.json
permissions:
  contents: write
concurrency:
  group: prepare-iu-catalog
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iu-catalog-artwork
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset tools
        run: |
          python -m pip install yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Import covers and requested audio
        run: python scripts/import-assets.py
      - name: Repair dependency lock and generate catalogue
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node generate-db.js
      - name: Test source and build
        run: |
          node generate-db.js --check
          npm test
          npm run build
      - name: Commit validated assets to working branch
        run: |
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add covers catalog database.js package-lock.json
          git add songs
          if ! git diff --cached --quiet; then
            git commit -m "Add validated album covers and imported audio; repair lockfile"
            git push origin HEAD:fix/iu-catalog-artwork
          fi
